<script>document.querySelectorAll('[data-ic]').forEach(el=>{el.innerHTML=icon(el.dataset.ic);});</script>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Penampil foto galeri">
  <button class="lb-tutup" id="lb-tutup" type="button" aria-label="Tutup">×</button>
  <span class="lb-hitung" id="lb-hitung"></span>
  <button class="lb-nav lb-prev" id="lb-prev" type="button" aria-label="Foto sebelumnya">‹</button>
  <figure class="lb-isi">
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button class="lb-nav lb-next" id="lb-next" type="button" aria-label="Foto berikutnya">›</button>
</div>
<script>
(function(){
  var items = Array.prototype.slice.call(document.querySelectorAll('.gallery-item'));
  if (!items.length) return;
  var data = items.map(function(f){
    var img = f.querySelector('img');
    var cap = f.querySelector('figcaption');
    return { src: img.getAttribute('src'), alt: img.getAttribute('alt') || '', cap: cap ? cap.textContent : '' };
  });
  var lb = document.getElementById('lb'), im = document.getElementById('lb-img'),
      cp = document.getElementById('lb-cap'), ht = document.getElementById('lb-hitung'), idx = 0;
  function tampil(i){
    idx = (i + data.length) % data.length;
    im.src = data[idx].src; im.alt = data[idx].alt; cp.textContent = data[idx].cap;
    ht.textContent = (idx + 1) + ' / ' + data.length;
  }
  function buka(i){ tampil(i); lb.hidden = false; document.body.style.overflow = 'hidden'; }
  function tutup(){ lb.hidden = true; document.body.style.overflow = ''; im.removeAttribute('src'); }
  items.forEach(function(f, i){ f.addEventListener('click', function(){ buka(i); }); });
  document.getElementById('lb-tutup').addEventListener('click', tutup);
  document.getElementById('lb-prev').addEventListener('click', function(e){ e.stopPropagation(); tampil(idx - 1); });
  document.getElementById('lb-next').addEventListener('click', function(e){ e.stopPropagation(); tampil(idx + 1); });
  lb.addEventListener('click', function(e){ if (e.target === lb) tutup(); });
  document.addEventListener('keydown', function(e){
    if (lb.hidden) return;
    if (e.key === 'Escape') tutup();
    else if (e.key === 'ArrowLeft') tampil(idx - 1);
    else if (e.key === 'ArrowRight') tampil(idx + 1);
  });
  var x0 = null;
  lb.addEventListener('touchstart', function(e){ x0 = e.changedTouches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 48) tampil(idx + (dx < 0 ? 1 : -1));
  }, { passive: true });
})();
</script>

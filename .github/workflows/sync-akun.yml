name: sync-akun
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://hisaniyah.web.app/pendataan/akun/index.html -o pendataan/akun/index.html
          git config user.name "hisaniyah"
          git config user.email "hisaniyahru1@gmail.com"
          git add pendataan/akun/index.html
          git commit -m "Pulihkan halaman akun Portal Alumni versi terbaru" || echo "tidak ada perubahan"
          git push

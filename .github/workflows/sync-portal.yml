name: sync-portal
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ambil berkas dari cermin Firebase
        run: |
          set -e
          base=https://hisaniyah.web.app
          for f in assets/css/portal.css assets/css/pages/admin.css assets/js/components.js assets/js/pages/admin.js pendataan/index.html pendataan/masuk/index.html pendataan/akun/index.html; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL "$base/$f" -o "$f"
            echo "OK $f $(wc -c < "$f")"
          done
      - name: Commit dan push
        run: |
          git config user.name "hisaniyah"
          git config user.email "hisaniyahru1@gmail.com"
          git add -A
          git commit -m "Portal Alumni P1-P4" || echo "tidak ada perubahan"
          git push

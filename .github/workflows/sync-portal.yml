name: sync-portal
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://hisaniyah.web.app/pendataan/index.html -o pendataan/index.html
          curl -fsSL https://hisaniyah.web.app/pendataan/masuk/index.html -o pendataan/masuk/index.html
          git config user.name "hisaniyah"
          git config user.email "hisaniyahru1@gmail.com"
          git add pendataan/index.html pendataan/masuk/index.html
          git commit -m "Portal Alumni satu halaman" || echo "tidak ada perubahan"
          git push

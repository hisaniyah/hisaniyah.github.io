name: sync-dash
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ambil halaman akun dari cermin Firebase
        run: |
          set -e
          curl -fsSL "https://hisaniyah.web.app/pendataan/akun/index.html" -o pendataan/akun/index.html
          echo "akun/index.html $(stat -c%s pendataan/akun/index.html) byte"
          grep -c "Akses Cepat" pendataan/akun/index.html
          if grep -q "Data yang Anda Kelola" pendataan/akun/index.html; then echo "GAGAL: panel lama masih ada"; exit 1; fi
          git config user.name "hisaniyah"
          git config user.email "hisaniyahru1@gmail.com"
          git add pendataan/akun/index.html
          git commit -m "Dashboard portal hanya Akses Cepat" || echo "tidak ada perubahan"
          git push

name: sync-kategori
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Salin berkas dari cermin Firebase
        run: |
          set -e
          for f in \
            assets/css/pages/admin.css \
            assets/js/pages/admin.js \
            pendataan/admin/berita/index.html \
            pendataan/admin/kategori/index.html \
            pendataan/akun/index.html \
          ; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL "https://hisaniyah.web.app/$f" -o "$f"
            echo "tersalin: $f"
          done
      - name: Commit dan push
        run: |
          git config user.name "hisaniyah"
          git config user.email "hisaniyahru1@gmail.com"
          git add -A
          git commit -m "Lipatan kategori ke halaman Berita" || echo "tidak ada perubahan"
          git push

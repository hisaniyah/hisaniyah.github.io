name: Salin halaman berita statis
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  salin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unduh halaman statis dari Firebase
        run: |
          set -euo pipefail
          for slug in pengurus-baru-hisaniyah-dilantik-siap-bekerja-keras-lakukan-banyak-terobosan sejarah-berdirinya-hisaniyah ziarah-makam-masyayikh-haul-akbar-39 puncak-haul-akbar-39-enam-ribu-jamaah peresmian-gedung-baru-mabna-kh-yahya-syabrowi upacara-hari-santri-2026-raudlatul-ulum-1 tawasul-khotmil-quran-haul-akbar-39 mubes-pengurus-korda-hisaniyah-2026 tahlil-bersama-masyarakat-haul-akbar-39 majelis-sholawat-haul-akbar-39 pentas-kenangan-reuni-nasional-haul-akbar-39 ramah-tamah-guru-dosen-pembuka-haul-akbar-39 seminar-fiqhun-nisa-haul-akbar-39; do
            mkdir -p "berita/$slug"
            curl -fsSL "https://hisaniyah.web.app/berita/$slug/" -o "berita/$slug/index.html"
            echo "$slug: $(wc -c < "berita/$slug/index.html") byte"
            head -c 100 "berita/$slug/index.html" | grep -q '<!DOCTYPE html>'
            grep -q '<meta property="og:image"' "berita/$slug/index.html"
            tail -c 20 "berita/$slug/index.html" | grep -q '</html>'
          done
      - name: Komit tiap halaman ke main
        run: |
          set -euo pipefail
          git config user.name hisaniyah
          git config user.email hisaniyah@users.noreply.github.com
          for slug in pengurus-baru-hisaniyah-dilantik-siap-bekerja-keras-lakukan-banyak-terobosan sejarah-berdirinya-hisaniyah ziarah-makam-masyayikh-haul-akbar-39 puncak-haul-akbar-39-enam-ribu-jamaah peresmian-gedung-baru-mabna-kh-yahya-syabrowi upacara-hari-santri-2026-raudlatul-ulum-1 tawasul-khotmil-quran-haul-akbar-39 mubes-pengurus-korda-hisaniyah-2026 tahlil-bersama-masyarakat-haul-akbar-39 majelis-sholawat-haul-akbar-39 pentas-kenangan-reuni-nasional-haul-akbar-39 ramah-tamah-guru-dosen-pembuka-haul-akbar-39 seminar-fiqhun-nisa-haul-akbar-39; do
            git add "berita/$slug/index.html"
            git commit -m "Tambah halaman statis $slug"
          done
          git push

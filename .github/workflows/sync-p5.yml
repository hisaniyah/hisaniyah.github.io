name: sync-p5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ambil berkas dari cermin Firebase dan hapus halaman email
        run: |
          set -e
          BASE=https://hisaniyah.web.app
          for f in assets/css/portal.css assets/js/components.js pendataan/index.html pendataan/masuk/index.html pendataan/akun/index.html pendataan/akun/data/index.html; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL "$BASE/$f" -o "$f"
            echo "$f $(stat -c%s "$f") byte"
          done
          git rm -r --ignore-unmatch pendataan/daftar pendataan/lupa-sandi pendataan/atur-ulang pendataan/verifikasi-email || true
          git config user.name "hisaniyah"
          git config user.email "hisaniyahru1@gmail.com"
          git add -A
          git status --short
          git commit -m "Portal Alumni P5" || echo "tidak ada perubahan"
          git push

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baca Berita — HISANIYAH</title>
<meta name="description" content="Artikel berita HISANIYAH.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HISANIYAH">
<meta property="og:title" content="Berita HISANIYAH">
<meta property="og:description" content="Artikel berita HISANIYAH.">
<meta property="og:image" content="https://hisaniyah.or.id/assets/img/berita/banner-hisaniyah-sejarah.jpg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/img/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/variables.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/pages/inner.css">
</head>
<body>
<div id="site-header"></div>
<main>
<section class="page-hero"><div class="container">
  <nav class="crumb" aria-label="Jejak halaman"><a href="/">Beranda</a><span>›</span><span>Berita</span></nav>
  <h1>Berita HISANIYAH</h1>
  <p>Artikel resmi dari portal berita HISANIYAH.</p>
</div></section>
<section class="section"><div class="container" id="article-box"><p class="lead">Memuat artikel…</p></div></section>
</main>
<div id="site-footer"></div>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/berita-statis.js"></script>
<script src="/assets/js/main.js"></script>
<script>
(async () => {
  await HisaData.load();
  const { esc, fmtDate, sanitize } = HisaData;
  const slug = new URLSearchParams(location.search).get('slug') || '';
  const box = document.getElementById('article-box');
  const b = HisaData.cache.berita.find(x => x.slug === slug && x.status === 'terbit');
  if (!b) { box.innerHTML = '<div class="notice">Artikel tidak ditemukan atau belum diterbitkan. Kembali ke <a href="/berita/" style="text-decoration:underline">daftar berita</a>.</div>'; return; }
  if (window.HISA_STATIS_BERITA && window.HISA_STATIS_BERITA[slug]) { location.replace('/berita/' + encodeURIComponent(slug) + '/'); return; }
  document.title = b.meta_title || b.judul + ' — HISANIYAH';
  const URL_ARTIKEL = 'https://hisaniyah.or.id/berita/' + encodeURIComponent(b.slug) + '/';
  const IKON_WA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
  const IKON_FB = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"/></svg>';
  const IKON_X = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>';
  const IKON_TG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>';
  const IKON_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 7h3a5 5 0 0 1 5 5 5 5 0 0 1-5 5h-3m-6 0H6a5 5 0 0 1-5-5 5 5 0 0 1 5-5h3"/><line x1="8" y1="12" x2="16" y2="12"/></svg>';
  const IKON_SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>';
  function barBagikan(bawah){
    const teks = b.judul + ' \u2014 HISANIYAH';
    const q = encodeURIComponent;
    return `<div class="share-bar${bawah ? ' bawah' : ''}"><span class="share-label">${bawah ? 'Bagikan artikel ini:' : 'Bagikan:'}</span>`
      + `<a class="share-btn wa" href="https://wa.me/?text=${q(teks + '\n' + URL_ARTIKEL)}" target="_blank" rel="noopener" aria-label="Bagikan ke WhatsApp" title="Bagikan ke WhatsApp">${IKON_WA}</a>`
      + `<a class="share-btn fb" href="https://www.facebook.com/sharer/sharer.php?u=${q(URL_ARTIKEL)}" target="_blank" rel="noopener" aria-label="Bagikan ke Facebook" title="Bagikan ke Facebook">${IKON_FB}</a>`
      + `<a class="share-btn x" href="https://twitter.com/intent/tweet?text=${q(teks)}&url=${q(URL_ARTIKEL)}" target="_blank" rel="noopener" aria-label="Bagikan ke X" title="Bagikan ke X">${IKON_X}</a>`
      + `<a class="share-btn tg" href="https://t.me/share/url?url=${q(URL_ARTIKEL)}&text=${q(teks)}" target="_blank" rel="noopener" aria-label="Bagikan ke Telegram" title="Bagikan ke Telegram">${IKON_TG}</a>`
      + `<button type="button" class="share-btn salin" data-salin="${URL_ARTIKEL}" aria-label="Salin tautan" title="Salin tautan">${IKON_LINK}</button>`
      + `<button type="button" class="share-btn asli" data-bagikan-asli data-judul="${esc(b.judul)}" data-url="${URL_ARTIKEL}">${IKON_SHARE}<span>Bagikan</span></button></div>`;
  }

  const others = HisaData.terbit().filter(x => x.Berita_ID !== b.Berita_ID).slice(0,3);

  function populerHTML(excludeId){
    const items = HisaData.populer(excludeId, 5);
    return '<aside class="card pop-card"><h3>Berita Populer</h3><ol class="pop-list">' + items.map((o,i) =>
      '<li><span class="pop-num">' + String(i+1).padStart(2,'0') + '</span><div><a href="/berita/' + encodeURIComponent(o.slug) + '/">' + esc(o.judul) + '</a><span class="pop-meta">' + esc(fmtDate(o.publish_at)) + ' \u00B7 ' + esc(HisaData.kategoriNama(o.Kategori_ID)) + '</span></div></li>').join('') + '</ol></aside>';
  }
  box.innerHTML = `
    <div class="news-layout"><div>
    <span class="chip">${esc(HisaData.kategoriNama(b.Kategori_ID))}</span>
    <h2 style="font-size:clamp(26px,3.6vw,38px);font-weight:800;line-height:1.25;margin:14px 0 10px;max-width:860px">${esc(b.judul)}</h2>
    <p class="meta-date">${icon('calendar')}${esc(fmtDate(b.publish_at))} &nbsp;·&nbsp; ${esc(b.penulis || 'Admin Media HISANIYAH')}</p>
    ${barBagikan(false)}
    <div style="border-radius:18px;overflow:hidden;aspect-ratio:16/7;margin:22px 0;max-width:960px">${HisaData.thumbHTML(b)}</div>
    <div class="article-body" style="max-width:760px;font-size:17.5px">${sanitize(b.isi)}</div>
    ${barBagikan(true)}
    </div><div>${populerHTML(b.Berita_ID)}</div></div>
    <div style="height:34px"></div>
    <h3 class="section-title" style="margin-bottom:18px">Berita Lainnya</h3>
    <div class="grid-3">${others.map(o => `
      <article class="card article-card"><a class="thumb" href="/berita/${encodeURIComponent(o.slug)}/">${HisaData.thumbHTML(o)}</a>
      <div class="body"><span class="meta-date">${icon('calendar')}${esc(fmtDate(o.publish_at))}</span><h3><a href="/berita/${encodeURIComponent(o.slug)}/">${esc(o.judul)}</a></h3>
      <a class="link-more" href="/berita/${encodeURIComponent(o.slug)}/">Baca Selengkapnya ${icon('arrowR')}</a></div></article>`).join('')}
    </div>`;
  box.querySelectorAll('[data-ic]').forEach(el => { el.innerHTML = icon(el.dataset.ic); });
  HisaData.hydrateMedia(box);
})();
</script>
</body>
</html>

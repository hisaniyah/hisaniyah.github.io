<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Pemesanan KTA — HISANIYAH</title>
<link rel="icon" href="/assets/img/logo-hisaniyah-trans-256.webp">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef4f4; color: #1c2b2b; }
  .layout { display: flex; min-height: 100vh; }
  aside { width: 215px; flex: none; background: linear-gradient(180deg, #016767, #014545); color: #fff; padding: 20px 14px; }
  aside .nama { font-size: 19px; font-weight: 800; letter-spacing: 1.5px; }
  aside .sub { font-size: 10px; opacity: .85; margin-bottom: 22px; }
  aside button { display: block; width: 100%; text-align: left; background: none; border: none; color: #dff2f2; padding: 11px 12px; border-radius: 9px; font-size: 14px; cursor: pointer; margin-bottom: 4px; }
  aside button.aktif { background: rgba(255,255,255,.18); color: #fff; font-weight: 700; }
  main { flex: 1; padding: 20px; min-width: 0; }
  h1 { font-size: 21px; color: #014d4d; margin-bottom: 16px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: #fff; border-radius: 13px; padding: 15px; box-shadow: 0 2px 8px rgba(1,77,77,.07); }
  .stat .angka { font-size: 25px; font-weight: 800; color: #014d4d; }
  .stat .ket { font-size: 12.5px; color: #7a8a8a; }
  .panel { background: #fff; border-radius: 13px; padding: 17px; box-shadow: 0 2px 8px rgba(1,77,77,.07); margin-bottom: 16px; }
  .panel h3 { font-size: 15px; color: #014d4d; margin-bottom: 10px; }
  .baris-info { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; }
  .btn { background: #016767; color: #fff; border: none; border-radius: 999px; padding: 11px 20px; min-height: 42px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn.oranye { background: #FE880D; color: #14201f; }
  .toolbar { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 13px; }
  .toolbar input, .toolbar select { border: 1.5px solid #cfdddd; border-radius: 10px; padding: 10px 12px; min-height: 42px; font-size: 13.5px; font-family: inherit; background: #fff; }
  .toolbar input { flex: 1; min-width: 170px; }
  .tabel-bungkus { overflow-x: auto; }
  .berkas-sel { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1.5px solid #cfdddd; cursor: zoom-in; background: #f2f7f7; }
  .thumb-muat { font-size: 12px; color: #7a8a8a; }
  .btn-lihat { background: #eef4f4; color: #014d4d; border: 1.5px solid #cfdddd; border-radius: 999px; padding: 8px 14px; min-height: 36px; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(10,25,25,.93); z-index: 60; flex-direction: column; align-items: center; justify-content: center; padding: 18px; }
  #overlay img { max-width: 96vw; max-height: 80vh; border-radius: 10px; background: #fff; }
  #ovKet { color: #fff; margin-top: 12px; font-size: 14.5px; text-align: center; }
  #ovTutup { position: absolute; top: 14px; right: 14px; background: #FE880D; color: #14201f; border: none; border-radius: 9px; padding: 10px 16px; font-size: 14px; font-weight: 800; cursor: pointer; }
  @media (max-width: 720px) {
    .layout { flex-direction: column; }
    aside { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 14px; }
    aside .nama { font-size: 17px; width: 100%; }
    aside button { flex: 1 1 0; text-align: center; }
    aside .sub { width: 100%; margin-bottom: 6px; }
    aside button { width: auto; margin-bottom: 0; padding: 10px 18px; border: 1.5px solid rgba(255,255,255,.5); background: rgba(255,255,255,.10); border-radius: 999px; font-weight: 600; font-size: 14.5px; }
    aside button.aktif { background: #FE880D; border-color: #FE880D; color: #14201f; font-weight: 800; }
    main { padding: 14px; }
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 9px 8px; border-bottom: 2px solid #e3eded; color: #557; white-space: nowrap; }
  td { padding: 9px 8px; border-bottom: 1px solid #eef3f3; vertical-align: top; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .chip.Menunggu { background: #fff3d6; color: #9a6b00; }
  .chip.Diproses { background: #dbeafe; color: #1e40af; }
  .chip.Selesai { background: #d9f5e3; color: #157347; }
  .chip.Dibatalkan { background: #fde2e2; color: #b02a2a; }
  td select, td input.resi { border: 1.5px solid #cfdddd; border-radius: 9px; padding: 8px 9px; min-height: 38px; font-size: 12.5px; font-family: inherit; background: #fff; }
  td input.resi { width: 118px; }
  .tautan { color: #016767; font-weight: 600; text-decoration: none; margin-right: 7px; white-space: nowrap; }
  label.lbl { display: block; font-size: 13.5px; font-weight: 700; margin: 13px 0 6px; }
  .panel input[type=text], .panel input[type=number] { width: 100%; border: 1.5px solid #cfdddd; border-radius: 10px; padding: 11px 12px; font-size: 14.5px; font-family: inherit; }
  .dua { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .hal { display: none; } .hal.tampil { display: block; }
  .paginasi { display: flex; gap: 6px; align-items: center; margin-top: 12px; font-size: 13px; }
  .paginasi button { border: 1.5px solid #cfdddd; background: #fff; border-radius: 7px; padding: 5px 11px; cursor: pointer; }
  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    aside { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    aside .sub { margin-bottom: 0; margin-right: 12px; }
    aside button { width: auto; }
    .dua { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div>
      <div class="nama">HISANIYAH</div>
      <div class="sub">Panel Admin — Pemesanan KTA</div>
    </div>
    <button id="navDash" class="aktif" onclick="tampil('dash')">🏠 Dashboard</button>
    <button id="navData" onclick="tampil('data')">🛒 Data Pesanan</button>
  </aside>

  <main>
    <section id="hal-dash" class="hal tampil">
      <h1>Dashboard Admin</h1>
      <div class="stat-grid">
        <div class="stat"><div class="angka" id="stTotal">–</div><div class="ket">🛒 Total Pesanan</div></div>
        <div class="stat"><div class="angka" id="stMenunggu">–</div><div class="ket">🕐 Menunggu</div></div>
        <div class="stat"><div class="angka" id="stDiproses">–</div><div class="ket">⚙️ Diproses</div></div>
        <div class="stat"><div class="angka" id="stSelesai">–</div><div class="ket">✅ Selesai</div></div>
      </div>
      <div class="panel">
        <h3>Informasi Harga Saat Ini</h3>
        <div class="baris-info"><span>Kartu E-Money</span><b id="infoEmoney">–</b></div>
        <div class="baris-info"><span>Kartu Biasa</span><b id="infoBiasa">–</b></div>
        <div class="baris-info"><span>Rekening Transfer</span><b id="infoRek">–</b></div>
      </div>
      <div class="panel">
        <h3>Pesanan Terbaru</h3>
        <div class="tabel-bungkus"><table><thead><tr><th>Tanggal</th><th>Nama</th><th>Jenis</th><th>Status</th></tr></thead><tbody id="tabelRingkas"></tbody></table></div>
      </div>
    </section>

    <section id="hal-data" class="hal">
      <h1>Data Pesanan</h1>
      <div class="panel">
        <div class="toolbar">
          <input type="text" id="cari" placeholder="🔍 Cari nama, nomor anggota, atau no WA…" oninput="renderTabel()">
          <select id="filterStatus" onchange="renderTabel()">
            <option value="">Semua Status</option><option>Menunggu</option><option>Diproses</option><option>Selesai</option><option>Dibatalkan</option>
          </select>
          <button class="btn" onclick="muat()">↻ Muat Ulang</button>
        </div>
        <div class="tabel-bungkus">
          <table>
            <thead><tr><th>No</th><th>Tanggal</th><th>Nama</th><th>Alamat</th><th>No. WA</th><th>Jenis</th><th>Harga</th><th>File</th><th>Status</th><th>Resi</th><th>Aksi</th></tr></thead>
            <tbody id="tabelData"></tbody>
          </table>
        </div>
        <div class="paginasi">
          <button onclick="pindahHalaman(-1)">‹</button>
          <span id="infoHalaman"></span>
          <button onclick="pindahHalaman(1)">›</button>
          <span id="infoJumlah" style="margin-left:8px;color:#7a8a8a"></span>
        </div>
      </div>
    </section>

  </main>
</div>

<script>
  var KEY = new URLSearchParams(location.search).get('key') || '';
  var API = 'https://script.google.com/macros/s/AKfycbxce3dB2NoynMSWRi1WOHiX9kIiPaVS42xDU16thpBIjRWet4KQNxBZ6wacr35rKoDmDA/exec';
  function apiAdmin(payload) {
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (!res || res.ok === false) throw new Error((res && res.error) || 'Jawaban server tidak dikenal.');
      return res;
    });
  }
  var DATA = [];
  var halaman = 1, PER_HAL = 10;

  function rp(n) { return 'Rp ' + Number(n || 0).toLocaleString('id-ID'); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  function tampil(hal) {
    ['dash', 'data'].forEach(function (h) {
      document.getElementById('hal-' + h).classList.toggle('tampil', h === hal);
    });
    document.getElementById('navDash').classList.toggle('aktif', hal === 'dash');
    document.getElementById('navData').classList.toggle('aktif', hal === 'data');
  }

  function muat() {
    apiAdmin({ aksi: 'admin.data', key: KEY }).then(function (res) {
      DATA = res.pesanan;
      var hitung = { Menunggu: 0, Diproses: 0, Selesai: 0 };
      DATA.forEach(function (d) { if (hitung.hasOwnProperty(d.status)) hitung[d.status]++; });
      document.getElementById('stTotal').textContent = DATA.length;
      document.getElementById('stMenunggu').textContent = hitung.Menunggu;
      document.getElementById('stDiproses').textContent = hitung.Diproses;
      document.getElementById('stSelesai').textContent = hitung.Selesai;
      document.getElementById('infoEmoney').textContent = rp(res.pengaturan.harga_emoney);
      document.getElementById('infoBiasa').textContent = rp(res.pengaturan.harga_biasa);
      document.getElementById('infoRek').textContent = res.pengaturan.bank + ' ' + res.pengaturan.no_rekening + ' a.n. ' + res.pengaturan.atas_nama;
      document.getElementById('tabelRingkas').innerHTML = DATA.slice(0, 5).map(function (d) {
        return '<tr><td>' + esc(String(d.tanggal).substring(0, 10)) + '</td><td>' + esc(d.nama) +
          '</td><td>' + esc(d.jenis) + '</td><td><span class="chip ' + esc(d.status) + '">' + esc(d.status) + '</span></td></tr>';
      }).join('') || '<tr><td colspan="4">Belum ada pesanan.</td></tr>';
      halaman = 1;
      renderTabel();
    }).catch(function (e) { alert('Gagal memuat: ' + e.message); });
  }

  function tersaring() {
    var q = document.getElementById('cari').value.toLowerCase();
    var st = document.getElementById('filterStatus').value;
    return DATA.filter(function (d) {
      if (st && d.status !== st) return false;
      if (!q) return true;
      return (d.nama + ' ' + d.wa + ' ' + d.id + ' ' + d.alamat).toLowerCase().indexOf(q) >= 0;
    });
  }

  function renderTabel() {
    var list = tersaring();
    var totalHal = Math.max(1, Math.ceil(list.length / PER_HAL));
    if (halaman > totalHal) halaman = totalHal;
    var awal = (halaman - 1) * PER_HAL;
    var potong = list.slice(awal, awal + PER_HAL);
    document.getElementById('tabelData').innerHTML = potong.map(function (d, i) {
      var opsi = ['Menunggu', 'Diproses', 'Selesai', 'Dibatalkan'].map(function (s) {
        return '<option ' + (s === d.status ? 'selected' : '') + '>' + s + '</option>';
      }).join('');
      return '<tr><td>' + (awal + i + 1) + '</td><td style="white-space:nowrap">' + esc(String(d.tanggal).substring(0, 10)) + '</td>' +
        '<td><b>' + esc(d.nama) + '</b><br><small>' + esc(d.id) + '</small></td>' +
        '<td>' + esc(d.alamat) + '</td><td>' + esc(d.wa) + '</td><td>' + esc(d.jenis) + '</td>' +
        '<td>' + rp(d.harga) + '</td>' +
        '<td><div class="berkas-sel">' +
        (d.buktiId ? '<img class="thumb" id="th-' + esc(d.id) + '" alt="Bukti transfer ' + esc(d.id) + '" style="display:none" onclick="perbesar(this)"><span class="thumb-muat" id="tm-' + esc(d.id) + '">Bukti: memuat…</span>' : '<span class="thumb-muat">Tidak ada bukti</span>') +
        (d.ktaId ? '<button type="button" class="btn-lihat" onclick="lihatKta(\'' + esc(d.ktaId) + '\')">Lihat KTA</button>' : '') +
        '</div></td>' +
        '<td><select id="st-' + esc(d.id) + '">' + opsi + '</select></td>' +
        '<td><input class="resi" id="resi-' + esc(d.id) + '" value="' + esc(d.resi) + '" placeholder="No. resi"></td>' +
        '<td><button class="btn" onclick="simpanBaris(\'' + esc(d.id) + '\')">Simpan</button></td></tr>';
    }).join('') || '<tr><td colspan="11">Tidak ada data.</td></tr>';
    document.getElementById('infoHalaman').textContent = 'Halaman ' + halaman + ' dari ' + totalHal;
    document.getElementById('infoJumlah').textContent = 'Menampilkan ' + potong.length + ' dari ' + list.length + ' data';
    muatThumb(potong);
  }

  function pindahHalaman(delta) { halaman += delta; if (halaman < 1) halaman = 1; renderTabel(); }

  function simpanBaris(id) {
    var status = document.getElementById('st-' + id).value;
    var resi = document.getElementById('resi-' + id).value;
    apiAdmin({ aksi: 'admin.status', key: KEY, id: id, status: status, resi: resi })
      .then(function () { muat(); })
      .catch(function (e) { alert('Gagal: ' + e.message); });
  }


  var cacheBerkas = {};
  function ambilBerkas(fileId) {
    if (cacheBerkas[fileId]) return Promise.resolve(cacheBerkas[fileId]);
    return apiAdmin({ aksi: 'admin.file', key: KEY, fileId: fileId }).then(function (res) {
      var url = 'data:' + res.mime + ';base64,' + res.base64;
      cacheBerkas[fileId] = url;
      return url;
    });
  }
  function muatThumb(list) {
    list.forEach(function (d) {
      if (!d.buktiId) return;
      ambilBerkas(d.buktiId).then(function (url) {
        var img = document.getElementById('th-' + d.id);
        var mu = document.getElementById('tm-' + d.id);
        if (img) { img.src = url; img.style.display = 'block'; }
        if (mu) mu.style.display = 'none';
      }).catch(function () {
        var mu = document.getElementById('tm-' + d.id);
        if (mu) mu.textContent = 'Bukti: gagal dimuat';
      });
    });
  }
  function perbesar(img) {
    if (!img.src) return;
    document.getElementById('ovImg').src = img.src;
    document.getElementById('ovKet').textContent = img.alt || '';
    document.getElementById('overlay').style.display = 'flex';
  }
  function lihatKta(fileId) {
    var ov = document.getElementById('ovImg');
    ov.removeAttribute('src');
    ov.style.visibility = 'hidden';
    document.getElementById('ovKet').textContent = 'Memuat KTA…';
    document.getElementById('overlay').style.display = 'flex';
    ambilBerkas(fileId).then(function (url) {
      ov.src = url;
      ov.style.visibility = 'visible';
      document.getElementById('ovKet').textContent = 'Kartu Tanda Anggota (KTA)';
    }).catch(function (e) {
      document.getElementById('ovKet').textContent = 'Gagal memuat: ' + e.message;
    });
  }
  function tutupOverlay() { document.getElementById('overlay').style.display = 'none'; }

  muat();
</script>
<div id="overlay" onclick="if(event.target===this)tutupOverlay()">
  <button id="ovTutup" onclick="tutupOverlay()">✕ Tutup</button>
  <img id="ovImg" alt="Pratinjau berkas">
  <div id="ovKet"></div>
</div>
</body>
</html>

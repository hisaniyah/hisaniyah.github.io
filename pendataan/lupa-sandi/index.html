<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lupa Kata Sandi — HISANIYAH</title>
<meta name="description" content="Atur ulang kata sandi akun HISANIYAH.">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/img/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/variables.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/pages/inner.css">
<link rel="stylesheet" href="/assets/css/pages/akun.css">
</head>
<body>
<div id="site-header"></div>
<main>
<section class="page-hero"><div class="container">
  <nav class="crumb" aria-label="Jejak halaman"><a href="/">Beranda</a><span>›</span><span>Lupa Kata Sandi</span></nav>
  <h1>Lupa Kata Sandi</h1>
  <p>Kami bantu Anda membuat kata sandi baru.</p>
</div></section>
<section class="section"><div class="container">
<div class="login-card">
  <img class="logo" src="/assets/img/logo-hisaniyah-trans-256.webp" alt="Logo HISANIYAH">
  <h2 style="font-size:22px;font-weight:800">Lupa Kata Sandi</h2>
  <p style="color:var(--ink-soft);margin-top:6px">Masukkan email akun Anda. Kami kirimkan tautan untuk membuat kata sandi baru (berlaku 1 jam).</p>
  <form id="form" style="display:grid;gap:11px;text-align:left;margin-top:16px">
    <div class="field"><label for="f-email">Email *</label><input id="f-email" type="email" required autocomplete="email" placeholder="nama@email.com"></div>
    <button class="btn btn-teal" type="submit" style="justify-content:center;padding:12px">Kirim Tautan Atur Ulang</button>
  </form>
  <p id="status" style="font-weight:600;color:var(--ink-soft);min-height:22px;margin-top:10px"></p>
  <p style="font-size:14px;margin-top:2px"><a href="/pendataan/masuk/">Kembali ke halaman Masuk</a></p>
</div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/main.js"></script>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const st = document.getElementById('status');
  st.textContent = 'Memproses…';
  try {
    await HisaData.apiCall('auth.lupa.sandi', { email: document.getElementById('f-email').value.trim() });
    st.textContent = 'Jika email itu terdaftar, tautan atur ulang sudah dikirim. Periksa kotak masuk (dan folder Spam) Anda.';
  } catch(err){ st.textContent = 'Gagal memproses: ' + err.message; }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kategori Berita — Admin CMS HISANIYAH</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/variables.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/pages/admin.css">
</head>
<body>
<header class="admin-top" id="admin-top"></header>
<div class="admin-wrap">
  <nav class="admin-side" id="admin-side" aria-label="Menu admin"></nav>
  <main class="admin-main"><h1>Kategori Berita</h1>
<p class="admin-sub">Kategori dipakai untuk mengelompokkan berita di website.</p>
<div class="panel"><h2 id="kat-form-title">Tambah Kategori</h2>
<form id="form" class="form-grid">
  <div class="field"><label for="f-nama">Nama kategori *</label><input id="f-nama" required maxlength="60"></div>
  <div class="field"><label for="f-urutan">Urutan tampil</label><input id="f-urutan" type="number" min="0" max="99" value="1"></div>
  <div class="field full" style="display:flex;gap:10px"><button class="btn btn-teal" type="submit" style="padding:11px 22px">Simpan Kategori</button><button class="abtn" type="button" id="btn-batal" style="display:none;padding:11px 18px">Batal Ubah</button></div>
</form></div>
<div class="panel"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Nama</th><th>Urutan</th><th>Jumlah Berita</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
</div>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/pages/admin.js"></script>
<script>renderAdminShell('/pendataan/admin/kategori/');</script>
<script>
(async () => {
  await HisaData.load();
  const { esc } = HisaData;
  let editId = '';
  const rows = document.getElementById('rows');
  function render(){
    rows.innerHTML = [...HisaData.cache.kategori].sort((a,b) => (a.urutan||0) - (b.urutan||0)).map(k => {
      const n = HisaData.cache.berita.filter(b => b.Kategori_ID === k.Kategori_ID).length;
      return `<tr><td><strong>${esc(k.nama)}</strong><br><small style="color:var(--ink-soft)">/${esc(k.slug)}</small></td><td>${k.urutan ?? ''}</td><td>${n}</td>
      <td><div class="row-actions"><button class="abtn" data-edit="${esc(k.Kategori_ID)}">Ubah</button><button class="abtn danger" data-del="${esc(k.Kategori_ID)}">Hapus</button></div></td></tr>`;
    }).join('') || '<tr><td colspan="4">Belum ada kategori.</td></tr>';
  }
  rows.addEventListener('click', e => {
    const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
    if (ed) { const k = HisaData.cache.kategori.find(x => x.Kategori_ID === ed.dataset.edit); editId = k.Kategori_ID;
      document.getElementById('f-nama').value = k.nama; document.getElementById('f-urutan').value = k.urutan ?? 1;
      document.getElementById('kat-form-title').textContent = 'Ubah Kategori'; document.getElementById('btn-batal').style.display = ''; }
    if (del) { const k = HisaData.cache.kategori.find(x => x.Kategori_ID === del.dataset.del);
      const n = HisaData.cache.berita.filter(b => b.Kategori_ID === k.Kategori_ID).length;
      if (n) { toast('Kategori masih dipakai ' + n + ' berita — pindahkan dulu beritanya'); return; }
      if (confirm('Hapus kategori "' + k.nama + '"?')) { HisaData.hapusKategori(k.Kategori_ID); toast('Kategori dihapus'); render(); } }
  });
  document.getElementById('btn-batal').addEventListener('click', () => { editId = ''; document.getElementById('form').reset(); document.getElementById('kat-form-title').textContent = 'Tambah Kategori'; document.getElementById('btn-batal').style.display = 'none'; });
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    HisaData.upsertKategori({ Kategori_ID: editId, nama: document.getElementById('f-nama').value.trim(), urutan: parseInt(document.getElementById('f-urutan').value || '1', 10) });
    toast('Kategori disimpan'); editId = ''; e.target.reset(); document.getElementById('kat-form-title').textContent = 'Tambah Kategori'; document.getElementById('btn-batal').style.display = 'none'; render();
  });
  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Berita — Admin CMS HISANIYAH</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/variables.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/pages/admin.css">
</head>
<body>
<header class="admin-top" id="admin-top"></header>
<div class="admin-wrap">
  <nav class="admin-side" id="admin-side" aria-label="Menu admin"></nav>
  <main class="admin-main"><h1>Berita</h1>
<p class="admin-sub">Tulis, ubah, terbitkan, atau hapus berita. Berita berstatus <b>Terbit</b> langsung tampil di website.</p>
<div class="admin-tabs" role="tablist">
  <button type="button" class="admin-tab aktif" data-tab="berita">Daftar Berita</button>
  <button type="button" class="admin-tab" data-tab="kategori">Kelola Kategori</button>
</div>
<div id="tab-berita">
<div class="panel">
  <div class="toolbar">
    <input type="search" id="q" placeholder="Cari judul berita…" aria-label="Cari berita">
    <select id="f-status" aria-label="Saring status"><option value="">Semua status</option><option value="terbit">Terbit</option><option value="draf">Draf</option></select>
    <a class="btn btn-orange" href="/pendataan/admin/berita/editor/" style="padding:11px 20px">+ Tulis Berita</a>
  </div>
  <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Judul</th><th>Kategori</th><th>Status</th><th>Dilihat</th><th>Tanggal</th><th>Aksi</th></tr></thead><tbody id="rows"><tr><td>Memuat…</td></tr></tbody></table></div>
</div>
</div>
<div id="tab-kategori" style="display:none">
<div class="panel"><h2 id="k-form-title">Tambah Kategori</h2>
<form id="k-form" class="form-grid">
  <div class="field"><label for="k-nama">Nama kategori *</label><input id="k-nama" required maxlength="60"></div>
  <div class="field"><label for="k-urutan">Urutan tampil</label><input id="k-urutan" type="number" min="0" max="99" value="1"></div>
  <div class="field full" style="display:flex;gap:10px"><button class="btn btn-teal" type="submit" style="padding:11px 22px">Simpan Kategori</button><button class="abtn" type="button" id="k-batal" style="display:none;padding:11px 18px">Batal Ubah</button></div>
</form></div>
<div class="panel"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Nama</th><th>Urutan</th><th>Jumlah Berita</th><th>Aksi</th></tr></thead><tbody id="k-rows"></tbody></table></div></div>
</div></main>
</div>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/pages/admin.js"></script>
<script>renderAdminShell('/pendataan/admin/berita/');</script>
<script>
(async () => {
  await HisaData.load();
  const { esc, fmtDate } = HisaData;
  const rows = document.getElementById('rows');
  /* Daftar berita kini dari server (admin.berita.list): memuat draf juga,
     penulis hanya menerima berita miliknya, dan tiap baris membawa jumlah
     tayang (kolom Dilihat). Bila server tak terjangkau, jatuh ke data publik
     terakhir tanpa angka tayang. */
  let items = [];
  try { items = await HisaData.apiCall('admin.berita.list', {}); }
  catch (e) { items = (HisaData.cache.berita || []).map(b => ({ ...b, dilihat: null })); }
  function render(){
    const q = document.getElementById('q').value.toLowerCase();
    const fs = document.getElementById('f-status').value;
    const tampil = items.filter(b => (!q || b.judul.toLowerCase().includes(q)) && (!fs || b.status === fs));
    rows.innerHTML = tampil.map(b => `<tr>
      <td><strong>${esc(b.judul)}</strong>${b.unggulan ? ' <span class="badge terbit">Unggulan</span>' : ''}<br><small style="color:var(--ink-soft)">/${esc(b.slug)}</small></td>
      <td>${esc(HisaData.kategoriNama(b.Kategori_ID))}</td>
      <td><span class="badge ${b.status === 'terbit' ? 'terbit' : 'draf'}">${b.status === 'terbit' ? 'Terbit' : 'Draf'}</span></td>
      <td>${b.dilihat == null ? '–' : Number(b.dilihat).toLocaleString('id-ID')}</td>
      <td>${esc(fmtDate(b.publish_at))}</td>
      <td><div class="row-actions">
        <a class="abtn" href="/pendataan/admin/berita/editor/?id=${encodeURIComponent(b.Berita_ID)}">Ubah</a>
        <button class="abtn" data-toggle="${esc(b.Berita_ID)}">${b.status === 'terbit' ? 'Jadikan Draf' : 'Terbitkan'}</button>
        <button class="abtn danger" data-del="${esc(b.Berita_ID)}">Hapus</button>
      </div></td></tr>`).join('') || '<tr><td colspan="6">Tidak ada berita yang cocok.</td></tr>';
  }
  document.getElementById('q').addEventListener('input', render);
  document.getElementById('f-status').addEventListener('change', render);
  rows.addEventListener('click', async e => {
    const t = e.target.closest('[data-toggle]'), d = e.target.closest('[data-del]');
    if (t) {
      const b = items.find(x => x.Berita_ID === t.dataset.toggle); if (!b) return;
      const baru = b.status === 'terbit' ? 'draf' : 'terbit';
      try { const r = await HisaData.apiCall('admin.berita.save', { ...b, status: baru }); Object.assign(b, r); HisaData.clearPubCache(); toast('Status diubah: ' + b.judul); render(); }
      catch (err) { toast('Gagal mengubah status: ' + err.message); }
    }
    if (d) {
      const b = items.find(x => x.Berita_ID === d.dataset.del); if (!b) return;
      if (confirm('Hapus berita "' + b.judul + '"? Tindakan ini tidak dapat dibatalkan.')) {
        try { await HisaData.apiCall('admin.berita.delete', { Berita_ID: b.Berita_ID }); items = items.filter(x => x.Berita_ID !== b.Berita_ID); HisaData.clearPubCache(); toast('Berita dihapus'); render(); renderKat(); }
        catch (err) { toast('Gagal menghapus: ' + err.message); }
      }
    }
  });
  render();
  /* ===== Tab Kelola Kategori (menu Kategori dilipat ke sini, 19 Nov 2026) ===== */
  const kRows = document.getElementById('k-rows');
  let editKat = '';
  function renderKat(){
    kRows.innerHTML = [...HisaData.cache.kategori].sort((a,b) => (a.urutan||0) - (b.urutan||0)).map(k => {
      const n = items.filter(b => b.Kategori_ID === k.Kategori_ID).length;
      return `<tr><td><strong>${esc(k.nama)}</strong><br><small style="color:var(--ink-soft)">/${esc(k.slug)}</small></td><td>${k.urutan ?? ''}</td><td>${n}</td>
      <td><div class="row-actions"><button class="abtn" data-kedit="${esc(k.Kategori_ID)}">Ubah</button><button class="abtn danger" data-kdel="${esc(k.Kategori_ID)}">Hapus</button></div></td></tr>`;
    }).join('') || '<tr><td colspan="4">Belum ada kategori.</td></tr>';
  }
  kRows.addEventListener('click', e => {
    const ed = e.target.closest('[data-kedit]'), del = e.target.closest('[data-kdel]');
    if (ed) { const k = HisaData.cache.kategori.find(x => x.Kategori_ID === ed.dataset.kedit); editKat = k.Kategori_ID;
      document.getElementById('k-nama').value = k.nama; document.getElementById('k-urutan').value = k.urutan ?? 1;
      document.getElementById('k-form-title').textContent = 'Ubah Kategori'; document.getElementById('k-batal').style.display = ''; }
    if (del) { const k = HisaData.cache.kategori.find(x => x.Kategori_ID === del.dataset.kdel);
      const n = items.filter(b => b.Kategori_ID === k.Kategori_ID).length;
      if (n) { toast('Kategori masih dipakai ' + n + ' berita — pindahkan dulu beritanya'); return; }
      if (confirm('Hapus kategori "' + k.nama + '"?')) { HisaData.hapusKategori(k.Kategori_ID); toast('Kategori dihapus'); renderKat(); render(); } }
  });
  document.getElementById('k-batal').addEventListener('click', () => { editKat = ''; document.getElementById('k-form').reset(); document.getElementById('k-form-title').textContent = 'Tambah Kategori'; document.getElementById('k-batal').style.display = 'none'; });
  document.getElementById('k-form').addEventListener('submit', e => {
    e.preventDefault();
    HisaData.upsertKategori({ Kategori_ID: editKat, nama: document.getElementById('k-nama').value.trim(), urutan: parseInt(document.getElementById('k-urutan').value || '1', 10) });
    toast('Kategori disimpan'); editKat = ''; e.target.reset(); document.getElementById('k-form-title').textContent = 'Tambah Kategori'; document.getElementById('k-batal').style.display = 'none'; renderKat(); render();
  });
  function aktifTab(t){
    document.querySelectorAll('.admin-tab').forEach(x => x.classList.toggle('aktif', x.dataset.tab === t));
    document.getElementById('tab-berita').style.display = t === 'berita' ? '' : 'none';
    document.getElementById('tab-kategori').style.display = t === 'kategori' ? '' : 'none';
    history.replaceState(null, '', t === 'kategori' ? '?tab=kategori' : location.pathname);
  }
  document.querySelectorAll('.admin-tab').forEach(x => x.addEventListener('click', () => aktifTab(x.dataset.tab)));
  renderKat();
  if (new URLSearchParams(location.search).get('tab') === 'kategori') aktifTab('kategori');
})();
</script>
</body>
</html>

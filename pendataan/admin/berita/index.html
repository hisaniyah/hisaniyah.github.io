<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Berita — Admin CMS HISANIYAH</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/variables.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/pages/admin.css">
</head>
<body>
<header class="admin-top" id="admin-top"></header>
<div class="admin-wrap">
  <nav class="admin-side" id="admin-side" aria-label="Menu admin"></nav>
  <main class="admin-main"><h1>Berita</h1>
<p class="admin-sub">Tulis, ubah, terbitkan, atau hapus berita. Berita berstatus <b>Terbit</b> langsung tampil di website.</p>
<div class="panel">
  <div class="toolbar">
    <input type="search" id="q" placeholder="Cari judul berita…" aria-label="Cari berita">
    <select id="f-status" aria-label="Saring status"><option value="">Semua status</option><option value="terbit">Terbit</option><option value="draf">Draf</option></select>
    <a class="btn btn-orange" href="/pendataan/admin/berita/editor/" style="padding:11px 20px">+ Tulis Berita</a>
  </div>
  <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Judul</th><th>Kategori</th><th>Status</th><th>Tanggal</th><th>Aksi</th></tr></thead><tbody id="rows"><tr><td>Memuat…</td></tr></tbody></table></div>
</div></main>
</div>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/pages/admin.js"></script>
<script>renderAdminShell('/pendataan/admin/berita/');</script>
<script>
(async () => {
  await HisaData.load();
  const { esc, fmtDate } = HisaData;
  const rows = document.getElementById('rows');
  function render(){
    const q = document.getElementById('q').value.toLowerCase();
    const fs = document.getElementById('f-status').value;
    const items = HisaData.cache.berita.filter(b => (!q || b.judul.toLowerCase().includes(q)) && (!fs || b.status === fs));
    rows.innerHTML = items.map(b => `<tr>
      <td><strong>${esc(b.judul)}</strong>${b.unggulan ? ' <span class="badge terbit">Unggulan</span>' : ''}<br><small style="color:var(--ink-soft)">/${esc(b.slug)}</small></td>
      <td>${esc(HisaData.kategoriNama(b.Kategori_ID))}</td>
      <td><span class="badge ${b.status === 'terbit' ? 'terbit' : 'draf'}">${b.status === 'terbit' ? 'Terbit' : 'Draf'}</span></td>
      <td>${esc(fmtDate(b.publish_at))}</td>
      <td><div class="row-actions">
        <a class="abtn" href="/pendataan/admin/berita/editor/?id=${encodeURIComponent(b.Berita_ID)}">Ubah</a>
        <button class="abtn" data-toggle="${esc(b.Berita_ID)}">${b.status === 'terbit' ? 'Jadikan Draf' : 'Terbitkan'}</button>
        <button class="abtn danger" data-del="${esc(b.Berita_ID)}">Hapus</button>
      </div></td></tr>`).join('') || '<tr><td colspan="5">Tidak ada berita yang cocok.</td></tr>';
  }
  document.getElementById('q').addEventListener('input', render);
  document.getElementById('f-status').addEventListener('change', render);
  rows.addEventListener('click', e => {
    const t = e.target.closest('[data-toggle]'), d = e.target.closest('[data-del]');
    if (t) { const b = HisaData.cache.berita.find(x => x.Berita_ID === t.dataset.toggle); b.status = b.status === 'terbit' ? 'draf' : 'terbit'; HisaData.save(); toast('Status diubah: ' + b.judul); render(); }
    if (d) { const b = HisaData.cache.berita.find(x => x.Berita_ID === d.dataset.del); if (confirm('Hapus berita "' + b.judul + '"? Tindakan ini tidak dapat dibatalkan.')) { HisaData.hapusBerita(b.Berita_ID); toast('Berita dihapus'); render(); } }
  });
  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akun Saya — HISANIYAH</title>
<meta name="description" content="Dashboard akun alumni HISANIYAH.">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/img/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/variables.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/pages/inner.css">
<link rel="stylesheet" href="/assets/css/pages/akun.css">
</head>
<body>
<div id="site-header"></div>
<main>
<section class="page-hero"><div class="container">
  <nav class="crumb" aria-label="Jejak halaman"><a href="/">Beranda</a><span>›</span><span>Akun Saya</span></nav>
  <h1>Akun Saya</h1>
  <p>Kelola data alumni Anda dan keluarga yang Anda bantu daftarkan.</p>
</div></section>
<section class="section"><div class="container">
<div id="akun-box"><p class="lead">Memuat akun…</p></div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/kta-download.js"></script>
<script>
(async () => {
  const box = document.getElementById('akun-box');
  const { esc } = HisaData;
  const ses = HisaData.getSession();
  if (!ses) { location.href = '/pendataan/masuk/'; return; }
  let me;
  try { me = await HisaData.apiCall('auth.me', {}); }
  catch(e) {
    if (/Token|token/.test(e.message)) { HisaData.clearSession(); location.href = '/pendataan/masuk/'; return; }
    box.innerHTML = '<div class="notice">Tidak dapat terhubung ke server akun saat ini. Coba muat ulang halaman.</div>'; return;
  }
  const u = me.user;
  const peran = { super_admin: 'Super Admin', pengurus_pusat: 'Pengurus Pusat', admin_korda: 'Admin KORDA', alumni: 'Alumni' }[u.Role] || u.Role;
  const stLabel = s => ({ menunggu: 'Menunggu Verifikasi', terverifikasi: 'Terverifikasi', ditolak: 'Ditolak', perlu_perbaikan: 'Perlu Perbaikan' }[s] || s);
  box.innerHTML = `
  <div class="akun-grid">
    <div class="profil-card">
      ${u.Foto ? `<img src="${esc(u.Foto)}" alt="Foto profil">` : `<div class="inisial">${esc((u.Nama || 'A').slice(0,1))}</div>`}
      <h3>${esc(u.Nama)}</h3><p>${esc(u.Email)}</p>
      <span class="role-badge">${esc(peran)}</span>
      <div style="margin-top:18px;display:grid;gap:9px">
        ${['super_admin','pengurus_pusat'].includes(u.Role) ? '<a class="btn btn-orange" href="/pendataan/admin/" style="justify-content:center">Buka Panel Admin CMS</a>' : ''}
        <button class="btn btn-outline" id="btn-keluar" style="justify-content:center">Keluar</button>
      </div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
        <h2 style="font-size:22px;font-weight:800">Data Alumni yang Anda Kelola (${me.kelola.length})</h2>
        <a class="btn btn-teal" href="/pendataan/akun/data/" style="padding:11px 18px">+ Tambah Data Alumni</a>
      </div>
      ${me.kelola.length ? me.kelola.map(k => `
      <div class="alumni-card">
        <div style="flex:1">
          <h4>${esc(k.alumni.Nama)}</h4>
          <p>${esc(k.alumni.angkatan_label || '')}${k.alumni.korda_label ? ' · ' + esc(k.alumni.korda_label) : ''} · Hubungan: ${esc(k.relasi.Hubungan)}${k.relasi.Status_Akses !== 'aktif' ? ' · Akses: ' + esc(k.relasi.Status_Akses) : ''}</p>
          ${k.alumni.no_anggota ? `<p>No. Anggota: <b>${esc(k.alumni.no_anggota)}</b></p>` : ''}
        </div>
        <span class="st ${esc(k.alumni.Status_Verifikasi)}">${esc(stLabel(k.alumni.Status_Verifikasi))}</span>
        ${k.relasi.is_pengelola_utama ? `<a class="btn btn-outline" href="/pendataan/akun/data/?id=${encodeURIComponent(k.alumni.Alumni_ID)}" style="padding:9px 15px">Ubah</a>` : ''}
      </div>
      ${k.alumni.Status_Verifikasi === 'terverifikasi' ? `
      <div class="kartu-anggota">
        <div class="ka-head">
          <img class="logo" src="/assets/img/logo-hisaniyah-trans-256.png" alt="Logo HISANIYAH">
          <div class="ka-org"><strong>HISANIYAH</strong><span>Himpunan Santri-Alumni K.H. Yahya Syabrawi</span></div>
          <span class="ka-badge">KARTU ANGGOTA</span>
        </div>
        <div class="ka-body">
          <div class="ka-foto" data-slot-foto="${esc(k.alumni.Alumni_ID)}">${k.alumni.foto_file_id ? `<img src="https://drive.google.com/thumbnail?id=${encodeURIComponent(k.alumni.foto_file_id)}&sz=w200" alt="Foto ${esc(k.alumni.Nama)}">` : `<span>${esc((k.alumni.Nama || 'A').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase())}</span>`}</div>
          <div class="ka-info">
            <span class="ka-label">Nama Anggota</span>
            <h4 class="${(k.alumni.Nama || '').length > 28 ? 'sangat-panjang' : (k.alumni.Nama || '').length > 18 ? 'panjang' : ''}">${esc(k.alumni.Nama)}</h4>
            <span class="ka-label">Nomor Anggota</span>
            <p class="ka-nomor">${esc(k.alumni.no_anggota || '-')}</p>
            <p class="ka-meta">${k.alumni.angkatan_label ? `<span>${esc(k.alumni.angkatan_label)}</span>` : ''}${k.alumni.korda_label ? `<span>${esc(k.alumni.korda_label)}</span>` : ''}</p>
          </div>
          <div class="ka-qr"><img class="qr" alt="Kode QR verifikasi" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=6&data=${encodeURIComponent('https://hisaniyah.or.id/verifikasi/?kode=' + k.alumni.kode_verifikasi_qr)}"><span>Pindai untuk verifikasi</span></div>
        </div>
      </div>${k.relasi.is_pengelola_utama ? `<div style="margin:-4px 0 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button type="button" class="btn btn-outline btn-foto-kta" data-alumni="${esc(k.alumni.Alumni_ID)}" style="padding:9px 15px">${k.alumni.foto_file_id ? '📷 Ganti Foto KTA' : '＋ Tambah Foto untuk KTA'}</button><span class="foto-kta-status" data-alumni="${esc(k.alumni.Alumni_ID)}" style="font-weight:600;color:var(--ink-soft);font-size:14px"></span><input type="file" accept="image/*" class="input-foto-kta" data-alumni="${esc(k.alumni.Alumni_ID)}" hidden></div>` : ''}<div style="margin:0 0 16px"><button type="button" class="btn btn-teal btn-unduh-kta" data-alumni="${esc(k.alumni.Alumni_ID)}" data-nama="${esc(k.alumni.Nama)}" data-nomor="${esc(k.alumni.no_anggota || '')}" data-angkatan="${esc(k.alumni.angkatan_label || '')}" data-korda="${esc(k.alumni.korda_label || '')}" data-foto="${k.alumni.foto_file_id ? 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(k.alumni.foto_file_id) + '&sz=w400' : ''}" data-kode="${esc(k.alumni.kode_verifikasi_qr || '')}" style="padding:10px 18px">⬇ Unduh KTA</button></div>` : ''}`).join('') : '<div class="notice">Belum ada data alumni. Tekan "Tambah Data Alumni" untuk mendaftarkan diri Anda atau anggota keluarga.</div>'}
      <p style="color:var(--ink-soft);font-size:14.5px;margin-top:8px">Satu akun Google boleh mengelola beberapa data alumni (misalnya untuk orang tua/saudara). Setiap data diverifikasi pengurus satu per satu.</p>
    </div>
  </div>`;
  document.querySelectorAll('.btn-unduh-kta').forEach(b => b.addEventListener('click', () => unduhKTA(b)));
  document.querySelectorAll('.btn-foto-kta').forEach(b => b.addEventListener('click', () => {
    const inp = document.querySelector('.input-foto-kta[data-alumni="' + b.getAttribute('data-alumni') + '"]');
    if (inp) inp.click();
  }));
  document.querySelectorAll('.input-foto-kta').forEach(inp => inp.addEventListener('change', async () => {
    const f = inp.files[0]; if (!f) return;
    const id = inp.getAttribute('data-alumni');
    const st = document.querySelector('.foto-kta-status[data-alumni="' + id + '"]');
    const btn = document.querySelector('.btn-foto-kta[data-alumni="' + id + '"]');
    try {
      if (st) st.textContent = 'Memproses foto…';
      const url = URL.createObjectURL(f);
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      const maks = 800, skala = Math.min(1, maks / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * skala); cv.height = Math.round(img.height * skala);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      const b64 = cv.toDataURL('image/jpeg', 0.85).split(',')[1];
      if (st) st.textContent = 'Mengunggah…';
      const r = await HisaData.apiCall('alumni.foto.upload', { Alumni_ID: id, base64: b64, mime: 'image/jpeg' });
      const slot = document.querySelector('[data-slot-foto="' + id + '"]');
      if (slot) slot.innerHTML = '<img src="' + r.url_tampil + '" alt="Foto anggota">';
      const ub = document.querySelector('.btn-unduh-kta[data-alumni="' + id + '"]');
      if (ub) ub.setAttribute('data-foto', 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(r.foto_file_id) + '&sz=w400');
      if (btn) btn.textContent = '📷 Ganti Foto KTA';
      if (st) st.textContent = 'Foto tersimpan ✓';
    } catch (err) { if (st) st.textContent = 'Gagal mengunggah: ' + err.message; }
    inp.value = '';
  }));
  document.getElementById('btn-keluar').addEventListener('click', async () => {
    try { await HisaData.apiCall('auth.logout', {}); } catch(e){}
    HisaData.clearSession(); location.href = '/';
  });
})();
</script>
</body>
</html>

      <span class="brand-mini"><img src="/assets/img/logo-hisaniyah-trans-256.webp" alt="">Portal Alumni</span>

  <a href="#" data-view="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8.2" r="3.4"/><path d="M3 19.6c.7-3.1 3-4.8 6-4.8s5.3 1.7 6 4.8"/><path d="M16.2 5.4a3.4 3.4 0 0 1 0 6.1M18.4 15.2c1.5.7 2.4 2 2.7 4"/></svg>Data Alumni</a>
  <a href="#" data-view="kta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><circle cx="8.6" cy="11" r="1.9"/><path d="M5.8 16.6c.6-1.5 1.6-2.2 2.8-2.2s2.2.7 2.8 2.2M14.5 9.8h4M14.5 13.4h4"/></svg>KTA Alumni</a>
  <a href="#" data-view="akun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.8"/><path d="M5 20.2c.9-3.4 3.6-5.2 7-5.2s6.1 1.8 7 5.2"/></svg>Akun</a>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/kta-download.js?v=3"></script>
<script src="/assets/js/foto-crop.js"></script>
<script>
  (function(){
    const pb = document.getElementById('portal-burger'), psb = document.getElementById('portal-sidebar'), pov = document.getElementById('portal-overlay');
    if (!pb || !psb) return;
    const tutup = () => { psb.classList.remove('open'); if (pov) pov.classList.remove('tampil'); };
    pb.addEventListener('click', () => { psb.classList.add('open'); if (pov) pov.classList.add('tampil'); });
    if (pov) pov.addEventListener('click', tutup);
    psb.querySelectorAll('a').forEach(a => a.addEventListener('click', tutup));
  })();
</script>
<script>
(async () => {
  const box = document.getElementById('akun-box');
  const { esc } = HisaData;
  const ses = HisaData.getSession();
  if (!ses) { location.href = '/pendataan/masuk/'; return; }
  let me;
  try { me = await HisaData.apiCall('auth.me', {}); }
  catch(e) {
    if (/Token|token/.test(e.message)) { HisaData.clearSession(); location.href = '/pendataan/masuk/'; return; }
    box.innerHTML = '<div class="notice">Tidak dapat terhubung ke server akun saat ini. Coba muat ulang halaman.</div>'; return;
  }
  const u = me.user;
  if (u.Role === 'alumni' && !(me.kelola || []).length) {
    location.replace('/pendataan/akun/data/');
    return;
  }
  const peran = { super_admin: 'Super Admin', pengurus_pusat: 'Pengurus Pusat', admin_korda: 'Admin KORDA', alumni: 'Alumni' }[u.Role] || u.Role;
  const stLabel = s => ({ menunggu: 'Menunggu Verifikasi', terverifikasi: 'Terverifikasi', ditolak: 'Nonaktif', perlu_perbaikan: 'Perlu Perbaikan' }[s] || s);
  const kelola = me.kelola || [];
  const diri = kelola.filter(k => k.relasi.Hubungan === 'Diri Sendiri');
  const urut = [...diri, ...kelola.filter(k => k.relasi.Hubungan !== 'Diri Sendiri')];
  const inisial2 = (u.Nama || 'A').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const inisialNama = n => (n || 'A').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const svgPlus = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>';
  const svgCard = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><circle cx="8.6" cy="11" r="1.9"/><path d="M5.8 16.6c.6-1.5 1.6-2.2 2.8-2.2s2.2.7 2.8 2.2M14.5 9.8h4M14.5 13.4h4"/></svg>';
  const svgFile = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>';
  const svgUsers = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
  const svgGlobe = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';
  const svgOrang = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.8"/><path d="M5 20.2c.9-3.4 3.6-5.2 7-5.2s6.1 1.8 7 5.2"/></svg>';
  const metaBaris = k => `${esc(k.relasi.Hubungan)}${k.alumni.angkatan_label ? ' · ' + esc(k.alumni.angkatan_label) : ''}${k.alumni.no_anggota ? ' · ' + esc(k.alumni.no_anggota) : ''}`;
  const barisData = (k, mode) => `
      <div class="prow${mode === 'ringkas' ? ' prow-klik' : ''}"${mode === 'ringkas' ? ' data-goto="data"' : ''}>
        <div class="ava">${esc(inisialNama(k.alumni.Nama))}</div>
        <div class="siapa"><b>${esc(k.alumni.Nama)}</b><span>${metaBaris(k)}</span></div>
        <span class="st ${esc(k.alumni.Status_Verifikasi)}">${esc(stLabel(k.alumni.Status_Verifikasi))}</span>
        ${mode === 'ringkas' ? '<span class="chev">›</span>' : (k.relasi.is_pengelola_utama ? `<a class="btn btn-outline" href="/pendataan/akun/data/?id=${encodeURIComponent(k.alumni.Alumni_ID)}" style="padding:8px 15px;flex:none">Edit</a>` : '')}
      </div>`;
  const blokKTA = (k) => `
      <div class="kartu-anggota">
        <div class="ka-head">
          <img class="logo" src="/assets/img/logo-hisaniyah-trans-256.webp" alt="Logo HISANIYAH">
          <div class="ka-org"><strong>HISANIYAH</strong><span>Himpunan Santri-Alumni K.H. Yahya Syabrawi</span></div>
          <span class="ka-badge">KARTU ANGGOTA</span>
        </div>
        <div class="ka-body">
          <div class="ka-foto" data-slot-foto="${esc(k.alumni.Alumni_ID)}">${k.alumni.foto_file_id ? `<img src="https://drive.google.com/thumbnail?id=${encodeURIComponent(k.alumni.foto_file_id)}&sz=w200" alt="Foto ${esc(k.alumni.Nama)}">` : `<span>${esc(inisialNama(k.alumni.Nama))}</span>`}</div>
          <div class="ka-info">
            <span class="ka-label">Nama Anggota</span>
            <h4 class="${(k.alumni.Nama || '').length > 28 ? 'sangat-panjang' : (k.alumni.Nama || '').length > 18 ? 'panjang' : ''}">${esc(k.alumni.Nama)}</h4>
            <span class="ka-label">Nomor Anggota</span>
            <p class="ka-nomor">${esc(k.alumni.no_anggota || '-')}</p>
            <p class="ka-meta">${k.alumni.angkatan_label ? `<span>${esc(k.alumni.angkatan_label)}</span>` : ''}${k.alumni.korda_label ? `<span>${esc(k.alumni.korda_label)}</span>` : ''}</p>
          </div>
          <div class="ka-qr"><img class="qr" alt="Kode QR verifikasi" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=6&data=${encodeURIComponent('https://hisaniyah.or.id/verifikasi/?kode=' + k.alumni.kode_verifikasi_qr)}"><span>Pindai untuk verifikasi</span></div>
        </div>
      </div>${k.relasi.is_pengelola_utama ? `<div style="margin:-4px 0 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button type="button" class="btn btn-outline btn-foto-kta" data-alumni="${esc(k.alumni.Alumni_ID)}" style="padding:9px 15px">${k.alumni.foto_file_id ? '📷 Ganti Foto KTA' : '＋ Tambah Foto untuk KTA'}</button><span class="foto-kta-status" data-alumni="${esc(k.alumni.Alumni_ID)}" style="font-weight:600;color:var(--ink-soft);font-size:14px"></span><input type="file" accept="image/*" class="input-foto-kta" data-alumni="${esc(k.alumni.Alumni_ID)}" hidden></div>` : ''}<div style="margin:0 0 16px;display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn btn-teal btn-unduh-kta" data-alumni="${esc(k.alumni.Alumni_ID)}" data-nama="${esc(k.alumni.Nama)}" data-nomor="${esc(k.alumni.no_anggota || '')}" data-angkatan="${esc(k.alumni.angkatan_label || '')}" data-korda="${esc(k.alumni.korda_label || '')}" data-foto="${k.alumni.foto_file_id ? 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(k.alumni.foto_file_id) + '&sz=w400' : ''}" data-kode="${esc(k.alumni.kode_verifikasi_qr || '')}" style="padding:10px 18px">⬇ Unduh KTA</button><a class="btn btn-orange" href="https://hisaniyah.or.id/pemesanan/" target="_blank" rel="noopener" style="padding:10px 18px">🖨️ Cetak KTA</a></div>`;
  const tilePanel = u.Role === 'alumni'
    ? `<a class="portal-tile" href="/"><span class="ic">${svgGlobe}</span>Web Resmi<small>hisaniyah.or.id</small></a>`
    : '';
  const navExtra = document.getElementById('portal-nav-extra');
  if (navExtra && u.Role !== 'alumni') {
    const pusat = ['super_admin', 'pengurus_pusat'].includes(u.Role);
    const svgDash = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>';
    const svgNews = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0V9"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>';
    const svgGal = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>';
    const svgMega = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3Z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>';
    const svgChart = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v3"/><path d="M12 10v8"/><path d="M17 6v12"/></svg>';
    const svgPin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';
    let h = '';
    if (pusat) {
      h += '<nav class="portal-nav"><p class="portal-nav-label">Menu CMS</p>'
        + `<a href="/pendataan/admin/">${svgDash}Dashboard CMS</a>`
        + `<a href="/pendataan/admin/berita/">${svgNews}Berita</a>`
        + `<a href="/pendataan/admin/pengumuman/">${svgMega}Pengumuman</a>`
        + (u.Role === 'super_admin' ? `<a href="/pendataan/admin/pimpinan/">${svgGal}Foto Pimpinan</a>` : '')
        + '</nav>';
    }
    h += '<nav class="portal-nav"><p class="portal-nav-label">Menu Pengurus</p>'
      + `<a href="/pendataan/admin/pengurus/">${svgChart}Statistik Alumni</a>`
      + `<a href="/pendataan/admin/pengurus/alumni/">${svgUsers}Data Alumni</a>`
      + `<a href="/pendataan/admin/pengurus/pengguna/">${svgOrang}Pengguna &amp; Peran</a>`
      + (pusat ? `<a href="/pendataan/admin/pengurus/wilayah/">${svgPin}KORDA &amp; Angkatan</a>` : '')
      + '</nav>';
    navExtra.innerHTML = h;
  }
  const baruId = new URLSearchParams(location.search).get('baru') || '';
  const baruK = baruId ? kelola.find(k => k.alumni.Alumni_ID === baruId && k.alumni.Status_Verifikasi === 'terverifikasi') : null;
  const berhasilHTML = baruK ? `
  <section class="portal-view" id="view-berhasil">
    <div class="portal-panel" style="text-align:center;padding:30px 24px 24px">
      <div style="width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--teal);display:grid;place-items:center"><svg viewBox="0 0 24 24" style="width:34px;height:34px" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg></div>
      <h2 style="font-size:23px;font-weight:800">Pendaftaran Berhasil!</h2>
      <p style="color:var(--ink-soft);font-size:15px;margin-top:8px;line-height:1.65">Selamat bergabung di HISANIYAH, <b style="color:var(--ink)">${esc(baruK.alumni.Nama)}</b>.<br>Data Anda sudah resmi tercatat sebagai anggota.</p>
      <div style="margin:18px auto 6px;max-width:340px;background:var(--teal-pale);border-radius:14px;padding:14px 18px">
        <span style="display:block;font-size:12px;font-weight:800;letter-spacing:.8px;color:var(--teal)">NOMOR ANGGOTA</span>
        <b style="font-size:26px;letter-spacing:.5px">${esc(baruK.alumni.no_anggota || '—')}</b>
      </div>
      <div><span class="st terverifikasi">● Anggota Aktif</span></div>
    </div>
    <h3 style="font-size:15px;font-weight:800;margin:20px 0 10px">Kartu Anggota Digital Anda</h3>
    ${blokKTA(baruK)}
    <div class="portal-panel" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <p style="font-size:14.5px;color:var(--ink-soft);line-height:1.6;margin:0">Ada keluarga yang juga alumni?<br>Daftarkan sekalian dengan akun ini.</p>
      <a class="btn btn-outline" href="/pendataan/akun/data/" style="padding:11px 18px;flex:none">+ Daftarkan Anggota Keluarga</a>
    </div>
    <a class="btn btn-teal" href="/pendataan/akun/" style="justify-content:center;width:100%;margin-top:16px;padding:14px">Selesai — ke Dashboard</a>
  </section>` : '';
  box.innerHTML = `
  ${berhasilHTML}
  <section class="portal-view aktif" id="view-dashboard">
    <p class="portal-greet">Selamat Datang,<strong>${esc(u.Nama)}</strong></p>
    <div class="portal-panel">
      <h3 style="font-size:13px;font-weight:800;color:var(--teal);letter-spacing:.6px;text-transform:uppercase;margin-bottom:16px">Akses Cepat</h3>
      <div class="portal-tiles${tilePanel ? '' : ' dua'}">
        <a class="portal-tile" href="/pendataan/akun/data/"><span class="ic">${svgPlus}</span>Tambah Data Alumni<small>Data diri atau keluarga</small></a>
        <a class="portal-tile" href="#" data-view-link="kta"><span class="ic">${svgCard}</span>Lihat KTA<small>Kartu anggota digital</small></a>
        ${tilePanel}
      </div>
    </div>
  </section>
  <section class="portal-view" id="view-data">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      <h2 style="font-size:22px;font-weight:800">Data Alumni</h2>
      <a class="btn btn-teal" href="/pendataan/akun/data/" style="padding:11px 18px">+ Tambah Data Alumni</a>
    </div>
    <p style="color:var(--ink-soft);font-size:14.5px;margin:-6px 0 16px">Satu akun Google boleh mengelola beberapa data alumni — data diri dan keluarga yang Anda daftarkan. Setiap data langsung aktif sebagai anggota begitu disimpan.</p>
    ${urut.length ? urut.map(k => barisData(k, 'penuh')).join('') : '<div class="notice">Belum ada data alumni yang Anda kelola.</div>'}
  </section>
  <section class="portal-view" id="view-kta">
    <h2 style="font-size:22px;font-weight:800;margin-bottom:16px">KTA Alumni</h2>
    ${kelola.length ? urut.map(k => k.alumni.Status_Verifikasi === 'terverifikasi' ? blokKTA(k) : barisData(k, 'penuh')).join('') : '<div class="notice">Belum ada data alumni. KTA akan muncul di sini setelah data Anda tersimpan.</div>'}
  </section>
  <section class="portal-view" id="view-akun">
    <h2 style="font-size:22px;font-weight:800;margin-bottom:16px">Akun Saya</h2>
    <div class="portal-panel" style="max-width:660px">
      <div class="profil-besar">
        <div class="ava">${u.Foto ? `<img src="${esc(u.Foto)}" alt="Foto profil">` : esc(inisial2)}</div>
        <div class="nama">${esc(u.Nama)}</div>
        <div class="email">${esc(u.Email)}</div>
        <span class="role-badge" style="margin-top:8px">${esc(peran)}</span>
      </div>
    </div>
    <div class="portal-panel" style="max-width:660px;margin-top:16px">
      <h3 style="font-size:13px;font-weight:800;color:var(--teal);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px">Tautan</h3>
      <a class="menu-row" href="/"><span class="ic">${svgGlobe}</span><span class="teks"><b>Web Resmi HISANIYAH</b><span>Kembali ke halaman publik hisaniyah.or.id</span></span><span class="chev">›</span></a>
      <a class="menu-row" href="https://myaccount.google.com/" target="_blank" rel="noopener"><span class="ic oranye">${svgOrang}</span><span class="teks"><b>Kelola Akun Google</b><span>Ganti nama &amp; foto akun di Google</span></span><span class="chev">›</span></a>
    </div>
    <p style="color:var(--ink-soft);font-size:13px;line-height:1.65;margin-top:16px;max-width:660px">Anda masuk dengan akun Google — nama dan foto di portal mengikuti akun Google Anda.</p>
  </section>`;
  function tampilView(v) {
    document.querySelectorAll('.portal-view').forEach(s => s.classList.toggle('aktif', s.id === 'view-' + v));
    document.querySelectorAll('[data-view]').forEach(a => { if (a.closest('#portal-nav') || a.closest('#portal-bnav')) a.classList.toggle('aktif', a.getAttribute('data-view') === v); });
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('#portal-nav a[data-view], #portal-bnav a[data-view]').forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); tampilView(a.getAttribute('data-view')); }));
  document.querySelectorAll('[data-view-link]').forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); tampilView(a.getAttribute('data-view-link')); }));
  document.querySelectorAll('[data-goto]').forEach(el => el.addEventListener('click', () => tampilView(el.getAttribute('data-goto'))));
  const viewAwal = new URLSearchParams(location.search).get('view');
  if (['dashboard', 'data', 'kta', 'akun'].includes(viewAwal)) tampilView(viewAwal);
  if (baruK) tampilView('berhasil');
  document.querySelectorAll('.btn-unduh-kta').forEach(b => b.addEventListener('click', () => unduhKTA(b)));
  document.querySelectorAll('.btn-foto-kta').forEach(b => b.addEventListener('click', () => {
    const inp = document.querySelector('.input-foto-kta[data-alumni="' + b.getAttribute('data-alumni') + '"]');
    if (inp) inp.click();
  }));
  document.querySelectorAll('.input-foto-kta').forEach(inp => inp.addEventListener('change', async () => {
    const f = inp.files[0]; if (!f) return;
    const id = inp.getAttribute('data-alumni');
    const st = document.querySelector('.foto-kta-status[data-alumni="' + id + '"]');
    const btn = document.querySelector('.btn-foto-kta[data-alumni="' + id + '"]');
    try {
      const b64 = await cropFoto(f);
      if (!b64) { inp.value = ''; return; }
      if (st) st.textContent = 'Mengunggah…';
      const r = await HisaData.apiCall('alumni.foto.upload', { Alumni_ID: id, base64: b64, mime: 'image/jpeg' });
      const slot = document.querySelector('[data-slot-foto="' + id + '"]');
      if (slot) slot.innerHTML = '<img src="' + r.url_tampil + '" alt="Foto anggota">';
      const ub = document.querySelector('.btn-unduh-kta[data-alumni="' + id + '"]');
      if (ub) ub.setAttribute('data-foto', 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(r.foto_file_id) + '&sz=w400');
      if (btn) btn.textContent = '📷 Ganti Foto KTA';
      if (st) st.textContent = 'Foto tersimpan ✓';
    } catch (err) { if (st) st.textContent = 'Gagal mengunggah: ' + err.message; }
    inp.value = '';
  }));
  document.querySelectorAll('.btn-keluar-portal').forEach(b => b.addEventListener('click', async (e) => {
    e.preventDefault();
    try { await HisaData.apiCall('auth.logout', {}); } catch(err){}
    HisaData.clearSession(); location.href = '/';
  }));
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk · Portal Alumni — HISANIYAH</title>
<meta name="description" content="Masuk ke Portal Alumni HISANIYAH dengan akun Google.">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/img/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/variables.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/portal.css">
</head>
<body class="portal-page">
<svg class="portal-swoosh" viewBox="0 0 330 175" preserveAspectRatio="none" aria-hidden="true"><path fill="#027C78" opacity=".45" d="M0,0 H330 C228,28 118,78 0,175 Z"/><path fill="#0E8A84" opacity=".45" d="M0,0 H258 C176,21 94,60 0,128 Z"/><path fill="#ABE8F4" opacity=".65" d="M0,0 H186 C128,14 68,41 0,86 Z"/></svg>
<main class="portal-login-wrap">
  <img class="portal-logo" src="/assets/img/logo-hisaniyah-trans-256.webp" alt="Logo HISANIYAH">
  <p class="portal-org">HIMPUNAN SANTRI-ALUMNI<br>K.H. YAHYA SYABRAWI</p>
  <h1 class="portal-title">Portal Alumni</h1>
  <section class="portal-card" aria-label="Masuk ke Portal Alumni">
    <button id="btn-google" class="portal-gbtn" type="button"><span class="g-circle"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.3 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.3 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg></span>Daftar/Login Dengan Akun Google</button>
    <div id="gis-btn" style="display:none;justify-content:center;margin-top:16px"></div>
    <p id="login-status" style="font-weight:600;color:var(--ink-soft)"></p>
    <p class="portal-note">Satu tombol untuk daftar dan masuk — akun otomatis dibuat saat pertama kali masuk dengan Google.</p>
  </section>
</main>
<svg class="portal-wave" viewBox="0 0 1440 130" preserveAspectRatio="none" aria-hidden="true"><path fill="#BFE9E6" opacity=".7" d="M0,88 C320,60 640,96 960,84 C1200,75 1360,54 1440,44 L1440,130 L0,130 Z"/><path fill="#FE880D" d="M0,100 C320,74 640,108 960,96 C1200,87 1360,66 1440,56 L1440,130 L0,130 Z"/><path fill="#016767" d="M0,112 C320,88 640,120 960,108 C1200,99 1360,80 1440,70 L1440,130 L0,130 Z"/></svg>
<script src="/assets/js/components.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(async () => {
  const st = document.getElementById('login-status');
  await HisaData.load();
  if (HisaData.getSession()) { location.href = '/pendataan/akun/'; return; }
  const cid = window.HISA_GIS_CLIENT_ID || '';
  if (!cid) { st.textContent = 'Login Google belum diaktifkan pengurus.'; return; }
  if (!HisaData.apiMode()) { st.textContent = 'Layanan akun belum terhubung ke server.'; return; }
  let gisSiap = false;
  const btnGoogle = document.getElementById('btn-google');
  btnGoogle.addEventListener('click', () => {
    if (!gisSiap) { st.textContent = 'Tunggu sebentar, menyiapkan masuk dengan Google…'; return; }
    st.textContent = 'Membuka pilihan akun Google…';
    google.accounts.id.prompt((n) => {
      if (n.isNotDisplayed() || n.isSkippedMoment()) {
        document.getElementById('gis-btn').style.display = 'flex';
        st.textContent = 'Ketuk tombol Google di bawah ini untuk masuk.';
      }
    });
  });
  function initGIS(){
    if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(initGIS, 400); return; }
    google.accounts.id.initialize({ client_id: cid, callback: async (resp) => {
      st.textContent = 'Memeriksa akun Google Anda…';
      try {
        const hasil = await HisaData.apiCall('auth.login', { id_token: resp.credential });
        HisaData.setSession({ token: hasil.token, user: hasil.user });
        st.textContent = 'Berhasil masuk. Mengalihkan…';
        location.href = '/pendataan/akun/';
      } catch(e){ st.textContent = 'Gagal masuk: ' + e.message; }
    } });
    google.accounts.id.renderButton(document.getElementById('gis-btn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', width: 280 });
    gisSiap = true;
  }
  initGIS();
})();
</script>
</body>
</html>
